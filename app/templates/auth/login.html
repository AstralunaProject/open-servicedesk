{% extends "auth_base.html" %}
{% block title %}Entrar{% endblock %}
{% block auth %}
<h2>Entrar</h2>
<p class="muted">Acesse com seu e-mail e senha.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field"><label for="email">E-mail</label><input type="email" id="email" name="email" value="{{ email }}" required autofocus autocomplete="username"></div>
  <div class="field"><label for="password">Senha</label><input type="password" id="password" name="password" required autocomplete="current-password"></div>
  <label class="check"><input type="checkbox" name="remember" value="1"> Manter conectado</label>
  <button class="btn btn-primary btn-block" type="submit">Entrar</button>
</form>
<div class="auth-links">
  <a href="{{ url_for('auth.forgot_password') }}">Esqueci minha senha</a>
  {% if cfg.allow_registration == "1" %}<a href="{{ url_for('auth.register') }}">Criar conta</a>{% endif %}
</div>
{% endblock %}
