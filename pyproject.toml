[project]
name = "ti-chamados"
version = "1.0.0"
description = "Central de serviços de T.I auto-hospedada para pequenas empresas"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AstralunaProject" }]
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Login>=0.6.3,<1",
    "Flask-WTF>=1.2,<2",
    "SQLAlchemy>=2.0,<3",
    "Werkzeug>=3.0,<4",
    "click>=8.1,<9",
    "MarkupSafe>=2.1,<4",
    "itsdangerous>=2.1,<3",
    "waitress>=3.0,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/AstralunaProject/open-servicedesk"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
