services:
  chamados:
    build: .
    image: open-servicedesk:latest
    container_name: open-servicedesk
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - chamados-dados:/data
    environment:
      # Endereço usado nos links dos e-mails. Troque pelo IP ou nome do servidor.
      BASE_URL: "http://localhost:8080"
      TZ: "America/Sao_Paulo"

volumes:
  chamados-dados:
